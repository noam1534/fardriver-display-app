<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>FarDriver Live Dashboard</title>
    <style>
        :root {
            --bg-dark: #090b10;
            --card-bg: #131722;
            --card-border: #1f2638;
            --accent-cyan: #00f0ff;
            --accent-green: #00e676;
            --accent-orange: #ff9100;
            --accent-red: #ff1744;
            --text-main: #ffffff;
            --text-muted: #8a94a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
            padding-top: env(safe-area-inset-top, 20px);
            padding-bottom: env(safe-area-inset-bottom, 20px);
            overflow-x: hidden;
        }

        /* Header & Connection Bar */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
            transition: all 0.3s ease;
        }

        .status-dot.connected {
            background-color: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-connect {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
        }

        .btn-demo {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--card-border);
        }

        .btn-demo.active {
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }

        /* Battery Top Bar */
        .battery-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 14px 18px;
            margin-bottom: 16px;
        }

        .battery-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .battery-voltage {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .battery-voltage span {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .battery-pct {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        .progress-track {
            width: 100%;
            height: 10px;
            background: #1c2230;
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00e676, #00f0ff);
            border-radius: 99px;
            transition: width 0.4s ease, background 0.4s ease;
        }

        /* Main Speed & Power Gauge */
        .speed-container {
            position: relative;
            background: radial-gradient(circle at center, #182032 0%, var(--card-bg) 75%);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .gauge-wrapper {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg.gauge-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(135deg);
        }

        circle.gauge-bg {
            fill: none;
            stroke: #1e2536;
            stroke-width: 14;
            stroke-linecap: round;
            stroke-dasharray: 534 712;
        }

        circle.gauge-progress {
            fill: none;
            stroke: var(--accent-cyan);
            stroke-width: 14;
            stroke-linecap: round;
            stroke-dasharray: 0 712;
            transition: stroke-dasharray 0.2s ease-out, stroke 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.5));
        }

        .speed-readout {
            text-align: center;
            z-index: 2;
        }

        .speed-value {
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
        }

        .speed-unit {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .gear-badge {
            margin-top: 12px;
            background: rgba(0, 240, 255, 0.12);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 4px 14px;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 800;
        }

        .power-bar-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--card-border);
        }

        .power-item {
            text-align: center;
            flex: 1;
        }

        .power-item .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .power-item .val {
            font-size: 1.25rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        /* Grid Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .stat-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .stat-val {
            font-size: 1.5rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        .stat-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Settings & Debug Footer */
        .settings-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 12px 16px;
            margin-top: auto;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .settings-row label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .settings-row input {
            width: 75px;
            background: #0d1017;
            border: 1px solid var(--card-border);
            color: white;
            padding: 6px 8px;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
        }

        .hex-monitor {
            font-family: "SF Mono", Menlo, monospace;
            font-size: 0.7rem;
            color: #5c677d;
            background: #090b10;
            padding: 8px;
            border-radius: 8px;
            overflow-x: auto;
            white-space: nowrap;
            direction: ltr;
            text-align: left;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="header">
        <div class="brand">
            <div class="status-dot" id="statusDot"></div>
            <span>FARDRIVER LIVE</span>
        </div>
        <div class="btn-group">
            <button class="btn-demo" id="demoBtn" onclick="toggleDemo()">סימולציה</button>
            <button class="btn-connect" id="connectBtn" onclick="connectBLE()">התחבר לבקר</button>
        </div>
    </div>

    <!-- Battery Status -->
    <div class="battery-card">
        <div class="battery-header">
            <div class="battery-voltage" id="voltageVal">0.0 <span>V</span></div>
            <div class="battery-pct" id="batteryPct">0%</div>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="batteryBar"></div>
        </div>
    </div>

    <!-- Central Speed & Power Gauge -->
    <div class="speed-container">
        <div class="gauge-wrapper">
            <svg class="gauge-svg" viewBox="0 0 240 240">
                <circle class="gauge-bg" cx="120" cy="120" r="113"></circle>
                <circle class="gauge-progress" id="powerArc" cx="120" cy="120" r="113"></circle>
            </svg>
            <div class="speed-readout">
                <div class="speed-value" id="speedVal">0</div>
                <div class="speed-unit">KM/H</div>
                <div class="gear-badge" id="gearBadge">הילוך 2 • DRIVE</div>
            </div>
        </div>

        <div class="power-bar-row">
            <div class="power-item">
                <div class="label">הספק רגעי</div>
                <div class="val" id="wattVal" style="color: var(--accent-cyan);">0 W</div>
            </div>
            <div class="power-item">
                <div class="label">זרם סוללה</div>
                <div class="val" id="lineAmpVal">0.0 A</div>
            </div>
            <div class="power-item">
                <div class="label">זרם פאזה</div>
                <div class="val" id="phaseAmpVal">0 A</div>
            </div>
        </div>
    </div>

    <!-- Telemetry Grid -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">טמפ׳ בקר (MOSFET)</div>
            <div class="stat-val" id="ctrlTempVal">--°C</div>
            <div class="stat-sub" id="ctrlTempStatus">תקין</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">טמפ׳ מנוע</div>
            <div class="stat-val" id="motorTempVal">--°C</div>
            <div class="stat-sub">חיישן תרמי</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">סל״ד מנוע (RPM)</div>
            <div class="val stat-val" id="rpmVal">0</div>
            <div class="stat-sub">סיבובים לדקה</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">מצב מצערת</div>
            <div class="stat-val" id="throttleVal">0%</div>
            <div class="stat-sub" id="errorStatus">ללא תקלות</div>
        </div>
    </div>

    <!-- Calibration & Raw Data Monitor -->
    <div class="settings-card">
        <div class="settings-row">
            <label>קוטר גלגל (אינץ׳):</label>
            <input type="number" id="wheelInch" value="29" step="0.5">
            <label>זוגות קטבים:</label>
            <input type="number" id="polePairs" value="23">
        </div>
        <div class="hex-monitor" id="hexLog">ממתין לנתונים מ-BLE (Service 0xFFE0)...</div>
    </div>

    <script>
        // BLE UUIDs Standard for FarDriver Dongles
        const SERVICE_UUID = 0xffe0;
        const CHAR_UUID = 0xffe1;

        let bleDevice = null;
        let rxBuffer = [];
        let demoInterval = null;

        // State object
        const telemetry = {
            voltage: 0,
            lineCurrent: 0,
            phaseCurrent: 0,
            rpm: 0,
            ctrlTemp: 0,
            motorTemp: 0,
            throttle: 0,
            gear: 2,
            error: 0
        };

        // Connect to FarDriver BLE Dongle
        async function connectBLE() {
            if (!navigator.bluetooth) {
                alert("דפדפן זה לא תומך ב-Web Bluetooth.\nבאייפון יש לפתוח את הדף דרך אפליקציית Bluefy.");
                return;
            }

            try {
                stopDemo();
                document.getElementById('connectBtn').innerText = 'סורק...';

                bleDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristic = await service.getCharacteristic(CHAR_UUID);

                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleIncomingData);

                document.getElementById('statusDot').classList.add('connected');
                document.getElementById('connectBtn').innerText = 'מחובר';
                document.getElementById('hexLog').innerText = 'מחובר! מאזין לחבילות מידע...';

            } catch (error) {
                console.error(error);
                document.getElementById('connectBtn').innerText = 'התחבר לבקר';
                alert('שגיאת חיבור: ' + error.message);
            }
        }

        function onDisconnected() {
            document.getElementById('statusDot').classList.remove('connected');
            document.getElementById('connectBtn').innerText = 'התחבר לבקר';
            document.getElementById('hexLog').innerText = 'החיבור נותק.';
        }

        // Parse Incoming BLE Stream into 16-byte FarDriver Frames
        function handleIncomingData(event) {
            const value = event.target.value;
            const hexArr = [];

            for (let i = 0; i < value.byteLength; i++) {
                const byte = value.getUint8(i);
                rxBuffer.push(byte);
                hexArr.push(byte.toString(16).padStart(2, '0').toUpperCase());
            }

            // Show raw stream for live verification
            document.getElementById('hexLog').innerText = 'RX: ' + hexArr.join(' ');

            // FarDriver packets typically start with 0xAA and are 16 bytes long
            while (rxBuffer.length >= 16) {
                if (rxBuffer[0] !== 0xAA) {
                    rxBuffer.shift();
                    continue;
                }
                const packet = rxBuffer.splice(0, 16);
                parseFarDriverPacket(packet);
            }
        }

        // Standard FarDriver Packet Decoder
        function parseFarDriverPacket(pkt) {
            const packetId = pkt[1];

            // Packet 0x00 / 0x01: Core Driving Telemetry (RPM, Gear, Current, Voltage)
            if (packetId === 0x00 || packetId === 0x01) {
                // RPM (Bytes 6-7, Big/Little Endian depending on firmware)
                const rawRpm = (pkt[7] << 8) | pkt[6];
                if (rawRpm < 15000) telemetry.rpm = rawRpm;

                // Voltage (often in 0.1V units)
                const rawVolt = ((pkt[9] << 8) | pkt[8]) / 10.0;
                if (rawVolt > 10 && rawVolt < 150) telemetry.voltage = rawVolt;

                // Line Current (Signed 16-bit, 0.1A units)
                let rawAmp = (pkt[11] << 8) | pkt[10];
                if (rawAmp > 32767) rawAmp -= 65536;
                telemetry.lineCurrent = rawAmp / 10.0;

                // Gear / Mode
                telemetry.gear = (pkt[2] & 0x03) + 1;
            }

            // Packet 0x04 / 0x0D: Temperatures & Phase Current
            if (packetId === 0x04 || packetId === 0x0D) {
                telemetry.ctrlTemp = pkt[4];
                telemetry.motorTemp = pkt[5];
                const rawPhase = (pkt[7] << 8) | pkt[6];
                if (rawPhase < 1000) telemetry.phaseCurrent = rawPhase;
            }

            updateUI();
        }

        // Update Dashboard UI
        function updateUI() {
            const wheelInch = parseFloat(document.getElementById('wheelInch').value) || 29;
            const polePairs = parseInt(document.getElementById('polePairs').value) || 23;

            // Calculate Speed (km/h) from Electrical/Mechanical RPM
            // Circumference in meters = wheelInch * 0.0254 * PI
            const circumferenceMeters = wheelInch * 0.0254 * Math.PI;
            const mechanicalRpm = telemetry.rpm; // Adjust by polePairs if controller sends eRPM
            const speedKmh = Math.round((mechanicalRpm * circumferenceMeters * 60) / 1000);

            // Calculate Power (Watts)
            const watts = Math.round(telemetry.voltage * telemetry.lineCurrent);

            // Battery Percentage (60V nominal: 16S Li-ion -> 48.0V empty, 67.2V full)
            const minV = 48.0;
            const maxV = 67.2;
            let pct = Math.round(((telemetry.voltage - minV) / (maxV - minV)) * 100);
            pct = Math.max(0, Math.min(100, pct));

            // Update DOM Elements
            document.getElementById('speedVal').innerText = speedKmh;
            document.getElementById('rpmVal').innerText = telemetry.rpm;
            document.getElementById('voltageVal').innerHTML = `${telemetry.voltage.toFixed(1)} <span>V</span>`;
            document.getElementById('batteryPct').innerText = `${pct}%`;
            document.getElementById('batteryBar').style.width = `${pct}%`;

            document.getElementById('wattVal').innerText = `${watts} W`;
            document.getElementById('lineAmpVal').innerText = `${telemetry.lineCurrent.toFixed(1)} A`;
            document.getElementById('phaseAmpVal').innerText = `${telemetry.phaseCurrent} A`;

            document.getElementById('ctrlTempVal').innerText = `${telemetry.ctrlTemp}°C`;
            document.getElementById('motorTempVal').innerText = `${telemetry.motorTemp}°C`;
            document.getElementById('throttleVal').innerText = `${telemetry.throttle}%`;

            const gearNames = { 1: 'הילוך 1 • ECO', 2: 'הילוך 2 • DRIVE', 3: 'הילוך 3 • SPORT' };
            document.getElementById('gearBadge').innerText = gearNames[telemetry.gear] || `הילוך ${telemetry.gear}`;

            // Update Power Arc Gauge (Max 3500W scale)
            const maxArc = 534;
            const powerRatio = Math.min(1, Math.max(0, watts / 3500));
            const dashVal = powerRatio * maxArc;
            const arcEl = document.getElementById('powerArc');
            arcEl.style.strokeDasharray = `${dashVal} 712`;

            if (powerRatio > 0.8) {
                arcEl.style.stroke = 'var(--accent-red)';
            } else if (powerRatio > 0.5) {
                arcEl.style.stroke = 'var(--accent-orange)';
            } else {
                arcEl.style.stroke = 'var(--accent-cyan)';
            }
        }

        // Simulation Mode for UI Testing
        function toggleDemo() {
            const btn = document.getElementById('demoBtn');
            if (demoInterval) {
                stopDemo();
                return;
            }

            btn.classList.add('active');
            btn.innerText = 'עצור סימולציה';
            document.getElementById('statusDot').classList.add('connected');

            let tick = 0;
            demoInterval = setInterval(() => {
                tick += 0.08;
                const throttleWave = (Math.sin(tick) + 1) / 2; // 0 to 1

                telemetry.voltage = 63.4 - (throttleWave * 2.1);
                telemetry.lineCurrent = +(throttleWave * 48).toFixed(1);
                telemetry.phaseCurrent = Math.round(throttleWave * 115);
                telemetry.rpm = Math.round(throttleWave * 460);
                telemetry.ctrlTemp = Math.round(34 + throttleWave * 12);
                telemetry.motorTemp = Math.round(41 + throttleWave * 18);
                telemetry.throttle = Math.round(throttleWave * 100);
                telemetry.gear = throttleWave > 0.7 ? 3 : (throttleWave > 0.3 ? 2 : 1);

                document.getElementById('hexLog').innerText = 'SIMULATION MODE ACTIVE • 60V SYSTEM';
                updateUI();
            }, 100);
        }

        function stopDemo() {
            if (demoInterval) {
                clearInterval(demoInterval);
                demoInterval = null;
            }
            const btn = document.getElementById('demoBtn');
            btn.classList.remove('active');
            btn.innerText = 'סימולציה';
            document.getElementById('statusDot').classList.remove('connected');
        }
    </script>
</body>
</html>
