<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>FarDriver Live Dashboard</title>
    <style>
        :root {
            --bg-dark: #090b10;
            --card-bg: #131722;
            --card-border: #1f2638;
            --accent-cyan: #00f0ff;
            --accent-green: #00e676;
            --accent-orange: #ff9100;
            --accent-red: #ff1744;
            --text-main: #ffffff;
            --text-muted: #8a94a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 14px;
            padding-top: max(14px, env(safe-area-inset-top));
            padding-bottom: max(14px, env(safe-area-inset-bottom));
            padding-left: max(14px, env(safe-area-inset-left));
            padding-right: max(14px, env(safe-area-inset-right));
            overflow-x: hidden;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            gap: 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .status-dot.connected {
            background-color: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 9px 13px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            white-space: nowrap;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-connect {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
        }

        .btn-connect.connected {
            background: linear-gradient(135deg, #00c853, #007e33);
            box-shadow: 0 4px 15px rgba(0, 200, 83, 0.25);
        }

        .btn-demo {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--card-border);
        }

        .btn-demo.active {
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }

        /* Main Layout (Portrait) */
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1;
        }

        .col-primary,
        .col-secondary {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Battery Card */
        .battery-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 13px 16px;
        }

        .battery-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .battery-voltage {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .battery-voltage span {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .battery-pct {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        .progress-track {
            width: 100%;
            height: 9px;
            background: #1c2230;
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00e676, #00f0ff);
            border-radius: 99px;
            transition: width 0.4s ease, background 0.4s ease;
        }

        /* Speed & Power Gauge */
        .speed-container {
            position: relative;
            background: radial-gradient(circle at center, #182032 0%, var(--card-bg) 75%);
            border: 1px solid var(--card-border);
            border-radius: 26px;
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .gauge-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg.gauge-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(135deg);
        }

        circle.gauge-bg {
            fill: none;
            stroke: #1e2536;
            stroke-width: 13;
            stroke-linecap: round;
            stroke-dasharray: 534 712;
        }

        circle.gauge-progress {
            fill: none;
            stroke: var(--accent-cyan);
            stroke-width: 13;
            stroke-linecap: round;
            stroke-dasharray: 0 712;
            transition: stroke-dasharray 0.2s ease-out, stroke 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.5));
        }

        .speed-readout {
            text-align: center;
            z-index: 2;
        }

        .speed-value {
            font-size: 4.2rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
        }

        .speed-unit {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .gear-badge {
            margin-top: 10px;
            background: rgba(0, 240, 255, 0.12);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 800;
        }

        .power-bar-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--card-border);
        }

        .power-item {
            text-align: center;
            flex: 1;
        }

        .power-item .label {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .power-item .val {
            font-size: 1.15rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .stat-title {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .stat-val {
            font-size: 1.4rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        .stat-sub {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        /* Settings & Hex Footer */
        .settings-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 10px 14px;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .settings-row label {
            font-size: 0.76rem;
            color: var(--text-muted);
        }

        .settings-row input,
        .settings-row select {
            width: 68px;
            background: #0d1017;
            border: 1px solid var(--card-border);
            color: white;
            padding: 5px 6px;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            font-size: 0.82rem;
        }

        .hex-monitor {
            font-family: "SF Mono", Menlo, monospace;
            font-size: 0.68rem;
            color: #6f7c96;
            background: #090b10;
            padding: 7px 8px;
            border-radius: 8px;
            overflow-x: auto;
            white-space: nowrap;
            direction: ltr;
            text-align: left;
        }

        /* LANDSCAPE LAYOUT FIX & OPTIMIZATION */
        @media (orientation: landscape) and (max-height: 560px) {
            body {
                padding: 8px 14px;
                padding-left: max(14px, env(safe-area-inset-left));
                padding-right: max(14px, env(safe-area-inset-right));
                min-height: 100dvh;
            }

            .header {
                margin-bottom: 8px;
            }

            .brand {
                font-size: 0.95rem;
            }

            button {
                padding: 7px 11px;
                font-size: 0.8rem;
            }

            .main-layout {
                display: grid;
                grid-template-columns: 1fr 1.35fr;
                gap: 10px;
                align-items: stretch;
            }

            .col-primary,
            .col-secondary {
                gap: 8px;
                justify-content: space-between;
            }

            .speed-container {
                padding: 10px;
                border-radius: 20px;
                flex: 1;
            }

            .gauge-wrapper {
                width: 150px;
                height: 150px;
            }

            .speed-value {
                font-size: 2.85rem;
            }

            .speed-unit {
                font-size: 0.72rem;
            }

            .gear-badge {
                margin-top: 5px;
                padding: 2px 9px;
                font-size: 0.7rem;
            }

            .power-bar-row {
                margin-top: 8px;
                padding-top: 7px;
            }

            .power-item .label {
                font-size: 0.68rem;
            }

            .power-item .val {
                font-size: 0.95rem;
            }

            .battery-card {
                padding: 8px 12px;
                border-radius: 14px;
            }

            .battery-header {
                margin-bottom: 5px;
            }

            .battery-voltage {
                font-size: 1.15rem;
            }

            .battery-pct {
                font-size: 0.95rem;
            }

            .progress-track {
                height: 7px;
            }

            .stats-grid {
                gap: 7px;
            }

            .stat-card {
                padding: 8px 10px;
                border-radius: 13px;
            }

            .stat-title {
                font-size: 0.7rem;
                margin-bottom: 2px;
            }

            .stat-val {
                font-size: 1.1rem;
            }

            .stat-sub {
                font-size: 0.66rem;
                margin-top: 1px;
            }

            .settings-card {
                padding: 7px 10px;
                border-radius: 13px;
            }

            .settings-row {
                margin-bottom: 5px;
                gap: 6px;
            }

            .settings-row label {
                font-size: 0.7rem;
            }

            .settings-row input,
            .settings-row select {
                width: 58px;
                padding: 3px 4px;
                font-size: 0.75rem;
            }

            .hex-monitor {
                padding: 5px 7px;
                font-size: 0.64rem;
            }
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="header">
        <div class="brand">
            <div class="status-dot" id="statusDot"></div>
            <span>FARDRIVER LIVE</span>
        </div>
        <div class="btn-group">
            <button class="btn-demo" id="demoBtn" onclick="toggleDemo()">סימולציה</button>
            <button class="btn-connect" id="connectBtn" onclick="handleConnectClick()">התחבר לבקר</button>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div class="main-layout">

        <!-- Primary Column: Speed & Power -->
        <div class="col-primary">
            <div class="speed-container">
                <div class="gauge-wrapper">
                    <svg class="gauge-svg" viewBox="0 0 240 240">
                        <circle class="gauge-bg" cx="120" cy="120" r="113"></circle>
                        <circle class="gauge-progress" id="powerArc" cx="120" cy="120" r="113"></circle>
                    </svg>
                    <div class="speed-readout">
                        <div class="speed-value" id="speedVal">0</div>
                        <div class="speed-unit">KM/H</div>
                        <div class="gear-badge" id="gearBadge">הילוך 2 • DRIVE</div>
                    </div>
                </div>

                <div class="power-bar-row">
                    <div class="power-item">
                        <div class="label">הספק רגעי</div>
                        <div class="val" id="wattVal" style="color: var(--accent-cyan);">0 W</div>
                    </div>
                    <div class="power-item">
                        <div class="label">זרם סוללה</div>
                        <div class="val" id="lineAmpVal">0.0 A</div>
                    </div>
                    <div class="power-item">
                        <div class="label">זרם פאזה</div>
                        <div class="val" id="phaseAmpVal">0 A</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Secondary Column: Battery, Telemetry & Calibration -->
        <div class="col-secondary">
            <div class="battery-card">
                <div class="battery-header">
                    <div class="battery-voltage" id="voltageVal">0.0 <span>V</span></div>
                    <div class="battery-pct" id="batteryPct">0%</div>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="batteryBar"></div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-title">טמפ׳ בקר (MOSFET)</div>
                    <div class="stat-val" id="ctrlTempVal">--°C</div>
                    <div class="stat-sub" id="ctrlTempStatus">תקין</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">טמפ׳ מנוע</div>
                    <div class="stat-val" id="motorTempVal">--°C</div>
                    <div class="stat-sub" id="motorTempStatus">חיישן תרמי</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">סל״ד מנוע (RPM)</div>
                    <div class="stat-val" id="rpmVal">0</div>
                    <div class="stat-sub">סיבובים לדקה</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">מצב מצערת</div>
                    <div class="stat-val" id="throttleVal">0%</div>
                    <div class="stat-sub" id="errorStatus">ללא תקלות</div>
                </div>
            </div>

            <div class="settings-card">
                <div class="settings-row">
                    <label>סוללה:</label>
                    <select id="packNominal" onchange="updateUI()">
                        <option value="48">48V</option>
                        <option value="60" selected>60V</option>
                        <option value="72">72V</option>
                    </select>

                    <label>גלגל (״):</label>
                    <input type="number" id="wheelInch" value="27.5" step="0.5" onchange="updateUI()">

                    <label>קטבים:</label>
                    <input type="number" id="polePairs" value="23" onchange="updateUI()">
                </div>
                <div class="hex-monitor" id="hexLog">מוכן לחיבור BLE • לחץ ״התחבר לבקר״ ב-Bluefy</div>
            </div>
        </div>

    </div>

    <script>
        const SERVICE_UUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
        const CHAR_UUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

        let bleDevice = null;
        let bleCharacteristic = null;
        let rxBuffer = [];
        let demoInterval = null;
        let isConnected = false;

        const telemetry = {
            voltage: 0,
            lineCurrent: 0,
            phaseCurrent: 0,
            rpm: 0,
            ctrlTemp: 0,
            motorTemp: 0,
            throttle: 0,
            gear: 2,
            error: 0
        };

        function setLog(msg) {
            const el = document.getElementById('hexLog');
            if (el) el.innerText = msg;
        }

        function setConnectState(connected, textOverride = null) {
            isConnected = connected;
            const btn = document.getElementById('connectBtn');
            const dot = document.getElementById('statusDot');

            if (connected) {
                btn.classList.add('connected');
                btn.innerText = textOverride || 'נתק בקר';
                dot.classList.add('connected');
            } else {
                btn.classList.remove('connected');
                btn.innerText = textOverride || 'התחבר לבקר';
                if (!demoInterval) {
                    dot.classList.remove('connected');
                }
            }
        }

        function handleConnectClick() {
            if (isConnected) {
                disconnectBLE();
            } else {
                connectBLE();
            }
        }

        async function disconnectBLE() {
            try {
                if (bleCharacteristic) {
                    bleCharacteristic.removeEventListener('characteristicvaluechanged', handleIncomingData);
                    bleCharacteristic = null;
                }
                if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
                    bleDevice.gatt.disconnect();
                }
            } catch (e) {
                console.warn('Disconnect warning:', e);
            } finally {
                setConnectState(false, 'התחבר לבקר');
                setLog('החיבור נותק ידנית.');
            }
        }

        async function requestBleDeviceSafe() {
            // Try with FarDriver service first; fallback to basic scan if WebBLE browser prefers simple request
            try {
                return await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });
            } catch (firstErr) {
                if (firstErr && firstErr.name === 'NotFoundError') {
                    throw firstErr;
                }
                return await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true
                });
            }
        }

        async function connectBLE() {
            if (!navigator.bluetooth || typeof navigator.bluetooth.requestDevice !== 'function') {
                const msg = 'Web Bluetooth אינו זמין בדפדפן זה. באייפון יש לפתוח דרך אפליקציית Bluefy.';
                setLog('שגיאה: ' + msg);
                alert(msg);
                return;
            }

            try {
                stopDemo();
                setConnectState(false, 'סורק...');
                setLog('פותח סריקת Bluetooth...');

                const device = await requestBleDeviceSafe();
                if (!device) {
                    throw new Error('לא נבחר מכשיר מהרשימה.');
                }

                bleDevice = device;
                bleDevice.removeEventListener('gattserverdisconnected', onDisconnected);
                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

                setConnectState(false, 'מתחבר...');
                setLog(`מתחבר אל ${device.name || 'התקן BLE'}...`);

                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHAR_UUID);

                await bleCharacteristic.startNotifications();
                bleCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingData);

                setConnectState(true, 'נתק בקר');
                setLog(`מחובר אל ${device.name || 'FarDriver'} • מאזין לנתונים...`);

            } catch (error) {
                console.error('BLE Connect Error:', error);
                setConnectState(false, 'התחבר לבקר');

                let reason = 'הסריקה בוטלה או שההתקן לא הגיב.';
                if (error) {
                    if (typeof error === 'string') {
                        reason = error;
                    } else if (error.message && error.message.trim() !== '') {
                        reason = error.message;
                    } else if (error.name) {
                        reason = `${error.name} (בדוק הרשאת Bluetooth ל-Bluefy וודא שהדונגל לא תפוס ע״י מכשיר אחר).`;
                    }
                }

                setLog('שגיאת BLE: ' + reason);
                alert('שגיאת חיבור: ' + reason);
            }
        }

        function onDisconnected() {
            bleCharacteristic = null;
            setConnectState(false, 'התחבר לבקר');
            setLog('החיבור לדונגל התנתק.');
        }

        function handleIncomingData(event) {
            const value = event.target.value;
            if (!value) return;

            const hexArr = [];
            for (let i = 0; i < value.byteLength; i++) {
                const byte = value.getUint8(i);
                rxBuffer.push(byte);
                hexArr.push(byte.toString(16).padStart(2, '0').toUpperCase());
            }

            setLog('RX: ' + hexArr.join(' '));

            while (rxBuffer.length >= 16) {
                if (rxBuffer[0] !== 0xAA) {
                    rxBuffer.shift();
                    continue;
                }
                const packet = rxBuffer.splice(0, 16);
                parseFarDriverPacket(packet);
            }
        }

        function parseFarDriverPacket(pkt) {
            const packetId = pkt[1];

            if (packetId === 0x00 || packetId === 0x01) {
                const rawRpm = (pkt[7] << 8) | pkt[6];
                if (rawRpm < 15000) telemetry.rpm = rawRpm;

                const rawVolt = ((pkt[9] << 8) | pkt[8]) / 10.0;
                if (rawVolt > 10 && rawVolt < 160) telemetry.voltage = rawVolt;

                let rawAmp = (pkt[11] << 8) | pkt[10];
                if (rawAmp > 32767) rawAmp -= 65536;
                telemetry.lineCurrent = rawAmp / 10.0;

                telemetry.gear = (pkt[2] & 0x03) + 1;
            }

            if (packetId === 0x04 || packetId === 0x0D) {
                telemetry.ctrlTemp = pkt[4];
                telemetry.motorTemp = pkt[5];
                const rawPhase = (pkt[7] << 8) | pkt[6];
                if (rawPhase < 1200) telemetry.phaseCurrent = rawPhase;
            }

            updateUI();
        }

        function getVoltageBounds(nominal) {
            switch (parseInt(nominal, 10)) {
                case 48: return { min: 39.0, max: 54.6 };
                case 72: return { min: 60.0, max: 84.0 };
                case 60:
                default: return { min: 48.0, max: 67.2 };
            }
        }

        function updateUI() {
            const wheelInch = parseFloat(document.getElementById('wheelInch').value) || 27.5;
            const packNominal = document.getElementById('packNominal').value || '60';
            const bounds = getVoltageBounds(packNominal);

            const circumferenceMeters = wheelInch * 0.0254 * Math.PI;
            const speedKmh = Math.round((telemetry.rpm * circumferenceMeters * 60) / 1000);
            const watts = Math.round(telemetry.voltage * telemetry.lineCurrent);

            let pct = 0;
            if (telemetry.voltage > 0) {
                pct = Math.round(((telemetry.voltage - bounds.min) / (bounds.max - bounds.min)) * 100);
                pct = Math.max(0, Math.min(100, pct));
            }

            document.getElementById('speedVal').innerText = speedKmh;
            document.getElementById('rpmVal').innerText = telemetry.rpm;
            document.getElementById('voltageVal').innerHTML = `${telemetry.voltage.toFixed(1)} <span>V</span>`;
            document.getElementById('batteryPct').innerText = `${pct}%`;
            document.getElementById('batteryBar').style.width = `${pct}%`;

            document.getElementById('wattVal').innerText = `${watts} W`;
            document.getElementById('lineAmpVal').innerText = `${telemetry.lineCurrent.toFixed(1)} A`;
            document.getElementById('phaseAmpVal').innerText = `${telemetry.phaseCurrent} A`;

            const ctrlEl = document.getElementById('ctrlTempVal');
            const ctrlSub = document.getElementById('ctrlTempStatus');
            ctrlEl.innerText = `${telemetry.ctrlTemp}°C`;
            if (telemetry.ctrlTemp >= 75) {
                ctrlEl.style.color = 'var(--accent-red)';
                ctrlSub.innerText = 'חם מאוד!';
            } else if (telemetry.ctrlTemp >= 55) {
                ctrlEl.style.color = 'var(--accent-orange)';
                ctrlSub.innerText = 'עומס בינוני';
            } else {
                ctrlEl.style.color = 'var(--text-main)';
                ctrlSub.innerText = 'תקין';
            }

            const motorEl = document.getElementById('motorTempVal');
            motorEl.innerText = `${telemetry.motorTemp}°C`;
            if (telemetry.motorTemp >= 95) {
                motorEl.style.color = 'var(--accent-red)';
            } else if (telemetry.motorTemp >= 75) {
                motorEl.style.color = 'var(--accent-orange)';
            } else {
                motorEl.style.color = 'var(--text-main)';
            }

            document.getElementById('throttleVal').innerText = `${telemetry.throttle}%`;

            const gearNames = { 1: 'הילוך 1 • ECO', 2: 'הילוך 2 • DRIVE', 3: 'הילוך 3 • SPORT' };
            document.getElementById('gearBadge').innerText = gearNames[telemetry.gear] || `הילוך ${telemetry.gear}`;

            const maxArc = 534;
            const powerRatio = Math.min(1, Math.max(0, watts / 3500));
            const dashVal = powerRatio * maxArc;
            const arcEl = document.getElementById('powerArc');
            arcEl.style.strokeDasharray = `${dashVal} 712`;

            if (powerRatio > 0.8) {
                arcEl.style.stroke = 'var(--accent-red)';
            } else if (powerRatio > 0.5) {
                arcEl.style.stroke = 'var(--accent-orange)';
            } else {
                arcEl.style.stroke = 'var(--accent-cyan)';
            }
        }

        function toggleDemo() {
            const btn = document.getElementById('demoBtn');
            if (demoInterval) {
                stopDemo();
                return;
            }

            if (isConnected) {
                disconnectBLE();
            }

            btn.classList.add('active');
            btn.innerText = 'עצור סימולציה';
            document.getElementById('statusDot').classList.add('connected');

            let tick = 0;
            demoInterval = setInterval(() => {
                tick += 0.08;
                const throttleWave = (Math.sin(tick) + 1) / 2;
                const packNominal = parseInt(document.getElementById('packNominal').value, 10) || 60;
                const baseVolt = packNominal === 48 ? 51.8 : (packNominal === 72 ? 79.6 : 63.4);

                telemetry.voltage = baseVolt - (throttleWave * 2.1);
                telemetry.lineCurrent = +(throttleWave * 48).toFixed(1);
                telemetry.phaseCurrent = Math.round(throttleWave * 115);
                telemetry.rpm = Math.round(throttleWave * 460);
                telemetry.ctrlTemp = Math.round(34 + throttleWave * 14);
                telemetry.motorTemp = Math.round(41 + throttleWave * 20);
                telemetry.throttle = Math.round(throttleWave * 100);
                telemetry.gear = throttleWave > 0.7 ? 3 : (throttleWave > 0.3 ? 2 : 1);

                setLog(`SIMULATION MODE ACTIVE • ${packNominal}V SYSTEM`);
                updateUI();
            }, 100);
        }

        function stopDemo() {
            if (demoInterval) {
                clearInterval(demoInterval);
                demoInterval = null;
            }
            const btn = document.getElementById('demoBtn');
            btn.classList.remove('active');
            btn.innerText = 'סימולציה';
            if (!isConnected) {
                document.getElementById('statusDot').classList.remove('connected');
            }
        }
    </script>
</body>
</html>
